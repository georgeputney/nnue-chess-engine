[project]
name = "aichessathon-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chess==1.11.2",
    "numpy==2.5.2",
    "numba==0.67.0",
    "torch==2.13.0",
    "onnxruntime==1.29.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = ["mypy>=1.18", "ruff>=0.14"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["N818"]

[tool.mypy]
strict = true
files = ["agent.py", "reference.py", "harness"]

# The @njit search and @jitclass state in agent.py cross the numba boundary, where mypy sees
# opaque Dispatcher / _JITWrapper objects: recursive jitted calls, jitclass field reads and
# the Board / SearchState return types trip checks that can't be satisfied without a wall of
# per-line ignores. These codes are disabled for agent only; every other strict check, and all
# of reference.py, still applies. The bitboard layer isn't type-checked (not in `files`).
[[tool.mypy.overrides]]
module = ["agent"]
disable_error_code = [
    "type-var", "call-arg", "operator", "arg-type", "attr-defined",
    "return-value", "no-any-return", "assignment", "index", "misc", "has-type",
]
